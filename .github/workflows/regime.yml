name: FLI regime monitor

on:
  schedule:
    - cron: "2 * * * 0-5"   # every hour at :02 (Sun-Fri UTC); weekend runs stay silent
  workflow_dispatch:
    inputs:
      force_send:
        description: "Send the table now even if nothing changed"
        type: boolean
        default: true

permissions:
  contents: write   # to save regime_state.json between runs

concurrency:
  group: regime-monitor
  cancel-in-progress: false

jobs:
  regime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: pip install pandas numpy yfinance requests

      - name: Check regime and notify
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FORCE_SEND: ${{ github.event_name == 'workflow_dispatch' && inputs.force_send && '1' || '0' }}
          NOTIFY_OFF: "0"
          SEND_ALWAYS: "1"   # hourly table; set "0" to only message when a regime turns favorable
        run: python regime_monitor.py

      - name: Save state
        run: |
          git config user.name "regime-bot"
          git config user.email "regime-bot@users.noreply.github.com"
          git add regime_state.json
          git diff --cached --quiet || (git commit -m "regime state update [skip ci]" && git pull --rebase && git push)
